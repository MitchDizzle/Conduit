name: Check levels

# This repo has no deploy and no secrets. mtch.tech's own workflow uploads
# public/ to mtch.tech/conduit/ (its src/_data/games.json lists this repo).
# To put a change live: in mtch.tech, node tools/release-game.js conduit,
# then commit and push there: that uploads just this game at the new
# commit. That only works while this repo is public.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check.js
