name: Deploy to mtch.tech/conduit/

# A push to main uploads public/ into the conduit/ folder of mtch.tech.
# "Run workflow" on the Actions tab does it by hand.
#
# The FTP secrets are the shared mtch.tech set, put on this repo with one
# command from the mtch.tech repo: tools/connect-repo.ps1 (see its
# docs/hosting-other-repos.md). Until they're set, the upload step is skipped
# rather than failing.
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FOLDER: conduit/   # this game's folder under mtch.tech (keep the trailing /)
      HAS_SECRETS: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the levels
        run: node tools/check.js

      - name: Upload to mtch.tech
        if: env.HAS_SECRETS == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_MTCH_DIR }}${{ env.FOLDER }}
          local-dir: ./public/

      - name: Secrets not set yet
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::No FTP secrets on this repo, so nothing was uploaded. Run tools/connect-repo.ps1 from the mtch.tech repo."
