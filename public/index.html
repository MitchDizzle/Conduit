<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181d">
  <meta name="description" content="Join each pair of dots with a pipe and fill every square. Starts at 2×2.">
  <title>Conduit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="bar">
      <a class="home" href="/games/">mtch.tech</a>
      <h1>Conduit</h1>
      <span class="spacer"></span>
    </header>

    <p class="level" id="level-title">Level 1</p>

    <canvas id="board" aria-label="Puzzle board. Drag from a dot to draw its pipe."></canvas>

    <p class="status" id="status" aria-live="polite"></p>

    <nav class="controls" aria-label="Levels">
      <button id="prev" type="button" aria-label="Previous level">‹</button>
      <button id="restart" type="button">Restart</button>
      <button id="next" type="button" aria-label="Next level">›</button>
    </nav>

    <p class="help">Join each pair of dots with a pipe. Pipes can't cross, and every square needs one.</p>
  </main>

  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
